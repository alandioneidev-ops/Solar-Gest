services:
  - type: web
    name: solar-gest-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "solar-gest-demo.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://solar-gest-demo.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: solar-gest-demo-db
          property: connectionString

databases:
  - name: solar-gest-demo-db
    plan: free
