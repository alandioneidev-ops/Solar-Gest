{% extends 'base.html' %}
{% block title %}Configurações | Solar Gest{% endblock %}
{% block heading %}<p class="eyebrow">Gestão</p><h1>Configurações</h1><p class="subtitle">Dados institucionais usados na operação da empresa.</p>{% endblock %}
{% block content %}<section class="panel"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field field-wide"><label for="nome">Nome da empresa *</label><input id="nome" name="nome" required value="{{ config.nome }}"></div><div class="field"><label for="cnpj">CNPJ</label><input id="cnpj" name="cnpj" value="{{ config.cnpj }}"></div><div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" value="{{ config.telefone }}"></div><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ config.email }}"></div><div class="field"><label for="moeda">Moeda</label><input id="moeda" name="moeda" maxlength="5" value="{{ config.moeda }}"></div><div class="field field-wide"><label for="endereco">Endereço</label><input id="endereco" name="endereco" value="{{ config.endereco }}"></div></div><div class="form-actions"><button class="button" type="submit">Salvar configurações</button><a class="button button-secondary" href="{% url 'gestao' %}">Cancelar</a></div></form></section>{% endblock %}
