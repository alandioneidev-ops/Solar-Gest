<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso | Solar Gest</title>
    <style>
        :root { --ink: #172a3a; --muted: #64748b; --line: #dbe5e9; --sun: #f4b942; --teal: #087f8c; }
        * { box-sizing: border-box; } body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; background: #edf5f3; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
        .login { width: min(100%, 420px); padding: 38px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 18px 50px rgba(23,42,58,.09); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-size: 24px; font-weight: 800; } .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; background: var(--sun); } .brand span:last-child { color: var(--teal); }
        h1 { margin: 0 0 8px; font-size: 26px; } .intro { margin: 0 0 28px; color: var(--muted); }
        form { display: grid; gap: 17px; } label { display: grid; gap: 7px; font-size: 13px; font-weight: 800; } input { width: 100%; padding: 13px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; } input:focus { outline: 2px solid #bde4df; border-color: var(--teal); }
        button { margin-top: 5px; padding: 13px; border: 0; border-radius: 7px; background: var(--sun); color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; } button:hover { filter: brightness(.96); }
        .error { padding: 10px; border-radius: 6px; background: #fff1f1; color: #a33a3a; font-size: 13px; }
    </style>
</head>
<body><main class="login"><div class="brand"><span class="mark">☼</span> Solar<span>Gest</span></div><h1>Bem-vindo de volta</h1><p class="intro">Entre para acompanhar a operação da sua empresa.</p>{% if form.errors %}<p class="error">Usuário ou senha inválidos. Tente novamente.</p>{% endif %}<form method="post">{% csrf_token %}<label for="id_username">Usuário<input id="id_username" name="username" type="text" autocomplete="username" required autofocus></label><label for="id_password">Senha<input id="id_password" name="password" type="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next }}"><button type="submit">Entrar no Solar Gest</button></form></main></body>
</html>
