{% extends 'base.html' %}

{% block title %}Novo cliente | Solar Gest{% endblock %}

{% block heading %}<p class="eyebrow">Carteira de clientes</p><h1>Novo cliente</h1><p class="subtitle">Cadastre os dados principais para iniciar o relacionamento.</p>{% endblock %}

{% block content %}
<section class="panel">
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div class="field field-wide"><label for="nome">Nome completo *</label><input id="nome" type="text" name="nome" required autofocus></div>
            <div class="field"><label for="telefone">Telefone</label><input id="telefone" type="text" name="telefone"></div>
            <div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email"></div>
            <div class="field"><label for="documento">CPF / CNPJ</label><input id="documento" type="text" name="documento"></div>
            <div class="field"><label for="endereco">Endereço</label><input id="endereco" type="text" name="endereco"></div>
        </div>
        <div class="form-actions"><button class="button" type="submit">Salvar cliente</button><a class="button button-secondary" href="{% url 'inicio' %}">Cancelar</a></div>
    </form>
</section>
{% endblock %}
